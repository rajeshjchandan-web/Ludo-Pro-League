*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#050b1d;color:#fff}button{font:inherit;border:0;cursor:pointer;color:inherit}#app{position:relative;width:100vw;height:100vh;max-width:520px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#0b1f4d,#14092e 56%,#050812)}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,rgba(34,231,255,.45),transparent 25%),radial-gradient(circle at 15% 72%,rgba(255,62,165,.28),transparent 22%),radial-gradient(circle at 87% 65%,rgba(255,211,90,.2),transparent 22%),linear-gradient(180deg,#0c2c67,#160b39 58%,#050811)}.sky:before{content:"";position:absolute;inset:-20%;background:linear-gradient(30deg,transparent 0 47%,rgba(255,255,255,.055) 48% 50%,transparent 51% 100%),radial-gradient(circle,rgba(255,255,255,.12) 0 2px,transparent 3px);background-size:120px 120px,52px 52px;transform:rotate(-12deg);opacity:.75}.sky:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 32%),linear-gradient(90deg,rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(0,0,0,.35))}.screen{position:absolute;inset:0;display:none}.screen.active{display:block}.safeTop{padding-top:env(safe-area-inset-top)}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:14px;right:14px;height:56px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 35px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);display:flex;align-items:center;gap:8px;padding:7px;z-index:3;backdrop-filter:blur(8px)}.avatar{width:42px;height:42px;border-radius:16px;background:linear-gradient(145deg,#ffdf6b,#ff7d3a);border:2px solid #fff;display:grid;place-items:center;font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.25)}.chip{height:38px;border-radius:15px;background:linear-gradient(180deg,#131f4b,#09112b);border:1px solid rgba(34,231,255,.45);display:flex;align-items:center;gap:5px;padding:0 10px;font-weight:900;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}.topIcon{width:37px;height:37px;border-radius:14px;background:linear-gradient(180deg,#27dfff,#2d6dff);display:grid;place-items:center;font-weight:900;box-shadow:0 5px 0 #06235c}.plus{background:#16d85e;border-radius:7px;padding:1px 6px;font-weight:1000;color:#fff}.hero{position:absolute;left:18px;right:18px;top:92px;text-align:center}.crest{margin:auto;width:126px;height:126px;border-radius:38px;background:conic-gradient(from 180deg,#22e7ff,#6f3dff,#ff3ea5,#ffd35a,#22e7ff);padding:4px;box-shadow:0 15px 35px rgba(0,0,0,.35),0 0 35px rgba(34,231,255,.25)}.crestInner{width:100%;height:100%;border-radius:34px;background:linear-gradient(180deg,#14296a,#0b1232);display:grid;place-items:center;position:relative;overflow:hidden}.crestInner:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 45%);animation:shine 4s linear infinite}.trophy{font-size:54px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));z-index:1}.diceMini{position:absolute;right:24px;bottom:23px;font-size:27px;z-index:2;transform:rotate(-12deg)}@keyframes shine{to{transform:rotate(360deg)}}.title{margin-top:10px;font-weight:1000;font-size:33px;line-height:.95;letter-spacing:-.5px;text-shadow:0 4px 0 rgba(0,0,0,.35)}.title b{color:var(--gold)}.sub{margin-top:7px;color:#b7f8ff;font-size:13px;font-weight:900;letter-spacing:.8px}.playBtn{margin-top:14px;height:62px;width:min(86%,330px);border-radius:24px;background:linear-gradient(180deg,#fff56e,#ff9d17);box-shadow:0 8px 0 #8f4f00,0 0 30px rgba(255,211,90,.35);border:3px solid #fff1a5;color:#17204b;font-size:24px;font-weight:1000;text-shadow:0 1px 0 #fff}.leagueStrip{margin:13px auto 0;width:min(88%,350px);height:36px;border-radius:99px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;color:#fff}.leagueStrip span{color:var(--gold)}
.modes{position:absolute;top:342px;left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{height:94px;border-radius:24px;background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 22px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.2);padding:10px;text-align:left;position:relative;overflow:hidden}.mode:before{content:"";position:absolute;right:-20px;top:-28px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.1)}.mode .icon{font-size:30px}.mode b{display:block;font-size:17px;margin-top:4px;text-shadow:0 2px 0 rgba(0,0,0,.4)}.mode small{font-size:11px;color:#b9eaff;font-weight:800}.mode.primary{background:linear-gradient(155deg,#0bd4ff,#2467ff 55%,#7a32ff);border-color:#91f7ff}.mode.pink{background:linear-gradient(155deg,#ff3ea5,#7b2cff)}.mode.gold{background:linear-gradient(155deg,#ffd35a,#ff8b2b);color:#25173d}.mode.green{background:linear-gradient(155deg,#2ff279,#00a8a8);color:#081f35}.badge{position:absolute;right:10px;top:9px;background:#ff2f5f;color:#fff;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:1000;box-shadow:0 3px 0 rgba(0,0,0,.25)}.events{position:absolute;top:552px;left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.event{height:70px;border-radius:21px;background:linear-gradient(180deg,#172b66,#091434);border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 18px rgba(0,0,0,.28);display:grid;place-items:center;text-align:center;font-weight:1000;font-size:12px}.event i{font-style:normal;font-size:26px}.bottom{position:absolute;left:0;right:0;bottom:0;height:76px;background:linear-gradient(180deg,rgba(23,52,132,.94),rgba(7,16,45,.98));border-top:1px solid rgba(34,231,255,.45);display:grid;grid-template-columns:repeat(5,1fr);z-index:8}.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:900;color:#c8e9ff}.nav i{font-style:normal;font-size:24px}.nav.active{color:#fff;background:linear-gradient(180deg,rgba(34,231,255,.25),transparent)}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.gameTop{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;height:50px;display:flex;align-items:center;justify-content:space-between;z-index:5}.gbtn,.turn{border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 18px rgba(0,0,0,.32);padding:10px 13px;font-weight:1000;backdrop-filter:blur(8px)}.turn{background:linear-gradient(180deg,#21e4ff,#1c64ff);border-color:#9df7ff}.hud{position:absolute;left:8px;right:8px;bottom:8px;height:78px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.25);box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);display:grid;grid-template-columns:1fr 92px 1fr;gap:8px;align-items:center;padding:8px;z-index:6;backdrop-filter:blur(8px)}.pPanel{height:54px;border-radius:20px;background:linear-gradient(180deg,#132b6d,#08183d);display:flex;align-items:center;gap:8px;padding:7px 9px;font-weight:1000;font-size:24px;color:#fff}.pPanel.com{justify-content:flex-end}.marker{width:35px;height:35px;border-radius:50%;background:#22e7ff;border:3px solid #fff;box-shadow:0 0 0 4px rgba(34,231,255,.18)}.marker.g{background:#2ff279;box-shadow:0 0 0 4px rgba(47,242,121,.18)}.dice{height:78px;margin-top:-26px;border-radius:24px;background:linear-gradient(180deg,#fff,#c8fbff);border:4px solid #ffd35a;color:#2058c9;font-size:42px;font-weight:1000;box-shadow:0 8px 0 #9f6b18,0 0 25px rgba(255,211,90,.45)}.dice.rolling{animation:roll .45s linear infinite}@keyframes roll{0%,100%{transform:rotate(0) scale(1)}33%{transform:rotate(-14deg) scale(1.06)}66%{transform:rotate(14deg) scale(.96)}}.toast{position:absolute;left:24px;right:24px;bottom:96px;z-index:15;min-height:48px;border-radius:18px;background:rgba(5,10,25,.88);border:1px solid rgba(255,211,90,.75);display:grid;place-items:center;text-align:center;font-weight:900;padding:10px;opacity:0;transform:translateY(18px);transition:.25s}.toast.show{opacity:1;transform:translateY(0)}.modal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center}.modal.show{display:flex}.card{width:86%;border-radius:30px;background:linear-gradient(180deg,#132c73,#0b1130);border:2px solid #ffd35a;text-align:center;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.5)}.card h2{margin:0 0 8px;color:#ffd35a;font-size:30px}.card button{margin-top:10px;border-radius:18px;background:linear-gradient(180deg,#fff56e,#ff9d17);color:#17204b;font-weight:1000;padding:13px 28px;box-shadow:0 6px 0 #8f4f00}@media(max-height:760px){.hero{top:78px}.crest{width:98px;height:98px;border-radius:28px}.crestInner{border-radius:24px}.trophy{font-size:42px}.title{font-size:27px}.playBtn{height:54px}.modes{top:290px}.mode{height:82px}.events{top:485px}.event{height:62px}.bottom{height:66px}.hud{height:68px}.dice{height:68px}.pPanel{font-size:20px}}
</style>
</head>
<body>
<div id="app">
  <div class="sky"></div>
  <section id="home" class="screen active">
    <div class="top"><div class="avatar">👑</div><div class="topIcon">⚙</div><div class="chip">💎 <span id="gems">150</span><span class="plus">+</span></div><div class="chip" style="margin-left:auto">🪙 <span id="coins">2250</span><span class="plus">+</span></div><div class="topIcon">🛒</div></div>
    <div class="hero"><div class="crest"><div class="crestInner"><div class="trophy">🏆</div><div class="diceMini">🎲</div></div></div><div class="title"><b>LUDO</b><br>PRO LEAGUE</div><div class="sub">ROLL • RACE • RULE THE LEAGUE</div><button class="playBtn" onclick="startGame('classic')">▶ PLAY CLASSIC</button><div class="leagueStrip">🏅 BRONZE LEAGUE <span>2,250</span> COINS</div></div>
    <div class="modes"><button class="mode primary" onclick="startGame('online')"><span class="badge">HOT</span><div class="icon">🌍</div><b>Quick Match</b><small>Online style demo + AI</small></button><button class="mode pink" onclick="showPopup('Friend Room','Room-code multiplayer will be added in online build.')"><div class="icon">🤝</div><b>Friend Room</b><small>Invite & play together</small></button><button class="mode gold" onclick="startGame('computer')"><div class="icon">🤖</div><b>Computer</b><small>Practice with AI</small></button><button class="mode green" onclick="showPopup('Nations Cup','Represent Uganda, India, Kenya and more in the next build.')"><div class="icon">🏆</div><b>Nations Cup</b><small>City & country battle</small></button></div>
    <div class="events"><button class="event" onclick="showPopup('Daily Reward','Come back daily for coins, gems and chests.')"><i>🎁</i>REWARDS</button><button class="event" onclick="showPopup('Lucky Spin','Rewarded ad spin placeholder for AdMob integration.')"><i>🎡</i>SPIN</button><button class="event" onclick="showPopup('Shop','Boards, dice skins and avatars will unlock here.')"><i>🎲</i>SHOP</button></div>
    <div class="bottom"><div class="nav active"><i>🏠</i>HOME</div><div class="nav"><i>📅</i>EVENT</div><div class="nav"><i>🏆</i>LEAGUE</div><div class="nav"><i>🎒</i>BAG</div><div class="nav"><i>💬</i>SOCIAL</div></div>
  </section>
  <section id="game" class="screen"><canvas id="gameCanvas"></canvas><div class="gameTop"><button class="gbtn" onclick="goHome()">⌂ Home</button><div class="turn" id="turnBadge">Your Turn</div><div class="gbtn">🪙 <span id="gameCoins">2250</span></div></div><div class="hud"><div class="pPanel"><div class="marker"></div><span>You</span></div><button class="dice" id="diceBtn" onclick="rollDice()">⚂</button><div class="pPanel com"><span>Com</span><div class="marker g"></div></div></div></section>
  <div id="toast" class="toast"></div><div id="modal" class="modal"><div class="card"><h2 id="modalTitle">LPL</h2><p id="modalText"></p><button onclick="closePopup()">OK</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let coins=2250,gems=150,screen='home';const canvas=$('gameCanvas'),ctx=canvas.getContext('2d');let board={x:0,y:0,s:0,c:0};const colors={red:'#ff2636',green:'#00b85a',yellow:'#ffdf26',blue:'#24b7ff'};let players=[{name:'You',color:'blue',home:[[1.5,10.5],[3.5,10.5],[1.5,12.5],[3.5,12.5]],tokens:[-1,-1,-1,-1],finished:0,human:true},{name:'Com',color:'green',home:[[10.5,1.5],[12.5,1.5],[10.5,3.5],[12.5,3.5]],tokens:[-1,-1,-1,-1],finished:0,human:false}];let turn=0,lastRoll=0,canMove=false,rolling=false;const path=[[6,13],[6,12],[6,11],[6,10],[6,9],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8],[0,7],[0,6],[1,6],[2,6],[3,6],[4,6],[5,6],[6,5],[6,4],[6,3],[6,2],[6,1],[6,0],[7,0],[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[9,6],[10,6],[11,6],[12,6],[13,6],[14,6],[14,7],[14,8],[13,8],[12,8],[11,8],[10,8],[9,8],[8,9],[8,10],[8,11],[8,12],[8,13],[8,14],[7,14],[6,14]],starts={blue:0,red:13,green:26,yellow:39};
function sfx(type){try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);let t=ac.currentTime;if(type==='roll'){o.type='square';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(760,t+.16);g.gain.setValueAtTime(.055,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start();o.stop(t+.21)}else if(type==='step'){o.type='sine';o.frequency.setValueAtTime(540,t);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.075);o.start();o.stop(t+.08)}else{o.type='triangle';[420,620,850].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.08));g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start();o.stop(t+.36)}}catch(e){}}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}addEventListener('resize',resize);function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');screen=id;if(id==='game')setTimeout(resize,40)}function startGame(){show('game');resetGame();toast('LPL Classic Match started. Roll dice to play.')}function goHome(){show('home')}function resetGame(){players.forEach(p=>{p.tokens=[-1,-1,-1,-1];p.finished=0});turn=0;lastRoll=0;canMove=false;updateHud();draw()}function updateHud(){$('turnBadge').textContent=turn===0?'Your Turn':'Computer Turn';$('coins').textContent=coins;$('gameCoins').textContent=coins;$('gems').textContent=gems}function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.remove('show'),2200)}function showPopup(t,m){$('modalTitle').textContent=t;$('modalText').textContent=m;$('modal').classList.add('show')}function closePopup(){$('modal').classList.remove('show')}
function rollDice(){if(rolling||canMove||turn!==0)return;doRoll(n=>{lastRoll=n;canMove=true;toast('You rolled '+n+'. Tap a blue token.');draw()})}function doRoll(cb){rolling=true;$('diceBtn').classList.add('rolling');sfx('roll');let count=0;let iv=setInterval(()=>{$('diceBtn').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.random()*6|0];if(++count>10){clearInterval(iv);let n=1+Math.floor(Math.random()*6);$('diceBtn').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][n-1];rolling=false;$('diceBtn').classList.remove('rolling');cb(n)}},50)}
canvas.addEventListener('pointerdown',e=>{if(turn!==0||!canMove)return;let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=players[0];for(let i=0;i<4;i++){let pos=tokenXY(p,i),dx=x-pos.x,dy=y-pos.y;if(dx*dx+dy*dy<520){moveToken(0,i,lastRoll);return}}});function moveToken(pi,ti,n){let p=players[pi],v=p.tokens[ti];if(v<0){if(n!==6){toast('Need 6 to open a token.');if(pi===0)endTurn();return}else p.tokens[ti]=0}else{p.tokens[ti]+=n;if(p.tokens[ti]>=52){p.finished++;p.tokens[ti]=52;sfx('win')}}animateSteps(n,()=>{checkCapture(pi,ti);canMove=false;if(p.finished>=4){coins+=500;showPopup('LPL Champion!','You won the match. +500 coins');updateHud()}else if(n===6&&pi===0){toast('Six! Roll again.')}else endTurn();draw()})}function animateSteps(n,done){let c=0;let iv=setInterval(()=>{sfx('step');draw();if(++c>=Math.max(1,n)){clearInterval(iv);done&&done()}},95)}function endTurn(){turn=1-turn;canMove=false;updateHud();draw();if(turn===1)setTimeout(computerTurn,650)}function computerTurn(){doRoll(n=>{lastRoll=n;let p=players[1],cand=p.tokens.map((v,i)=>({v,i})).filter(o=>o.v>=0||n===6);if(!cand.length){toast('Computer rolled '+n+' - no move');return setTimeout(endTurn,850)}let pick=cand.sort((a,b)=>b.v-a.v)[0];toast('Computer rolled '+n);moveToken(1,pick.i,n)})}function checkCapture(pi,ti){let me=players[pi],op=players[1-pi],mv=me.tokens[ti];if(mv<0||mv>=52)return;let abs=(starts[me.color]+mv)%52;for(let i=0;i<4;i++){let ov=op.tokens[i];if(ov>=0&&ov<52&&((starts[op.color]+ov)%52)===abs){op.tokens[i]=-1;toast(pi===0?'Captured!':'Computer captured your token!');sfx('win')}}}
function cellToXY(c,r){return{x:board.x+c*board.c+board.c/2,y:board.y+r*board.c+board.c/2}}function tokenXY(p,i){let v=p.tokens[i];if(v<0)return cellToXY(...p.home[i]);if(v>=52)return cellToXY(7,7);let a=(starts[p.color]+v)%52;return cellToXY(path[a][0],path[a][1])}function draw(){if(screen!=='game')return;ctx.clearRect(0,0,innerWidth,innerHeight);drawArena();let max=Math.min(innerWidth-22,innerHeight-192);board.s=max;board.c=max/15;board.x=(innerWidth-max)/2;board.y=Math.max(74,(innerHeight-max)/2-12);drawBoard();drawTokens()}function drawArena(){let g=ctx.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,'#0b2e6d');g.addColorStop(.55,'#24104d');g.addColorStop(1,'#050812');ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#ffffff';for(let y=90;y<innerHeight;y+=46){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y+80);ctx.stroke()}for(let x=-80;x<innerWidth;x+=72){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+180,innerHeight);ctx.stroke()}ctx.restore();let rg=ctx.createRadialGradient(innerWidth/2,innerHeight*.23,20,innerWidth/2,innerHeight*.23,innerHeight*.55);rg.addColorStop(0,'rgba(34,231,255,.36)');rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,innerWidth,innerHeight)}
function drawBoard(){let x=board.x,y=board.y,c=board.c;ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=24;ctx.fillStyle='#101a3d';roundRect(x-10,y-10,board.s+20,board.s+20,22,true);ctx.shadowBlur=0;let grd=ctx.createLinearGradient(x,y,x+board.s,y+board.s);grd.addColorStop(0,'#f8fdff');grd.addColorStop(1,'#dfe7ff');ctx.fillStyle=grd;roundRect(x,y,board.s,board.s,14,true);for(let r=0;r<15;r++)for(let col=0;col<15;col++){let color='rgba(255,255,255,.92)';if(col<6&&r<6)color=colors.red;if(col>8&&r<6)color=colors.green;if(col<6&&r>8)color=colors.blue;if(col>8&&r>8)color=colors.yellow;ctx.fillStyle=color;ctx.fillRect(x+col*c,y+r*c,c,c);ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1;ctx.strokeRect(x+col*c,y+r*c,c,c)}['red','green','blue','yellow'].forEach((cl,idx)=>{let sx=idx==0||idx==2?0:9,sy=idx<2?0:9;ctx.fillStyle=colors[cl];ctx.fillRect(x+sx*c,y+sy*c,6*c,6*c);ctx.fillStyle='rgba(255,255,255,.94)';roundRect(x+(sx+1.05)*c,y+(sy+1.05)*c,3.9*c,3.9*c,c*.18,true);[[1.9,1.9],[4.1,1.9],[1.9,4.1],[4.1,4.1]].forEach(p=>{ctx.fillStyle=colors[cl];circle(x+(sx+p[0])*c,y+(sy+p[1])*c,c*.36,true)})});for(let i=1;i<=5;i++){ctx.fillStyle=colors.green;ctx.fillRect(x+7*c,y+i*c,c,c);ctx.fillStyle=colors.yellow;ctx.fillRect(x+(14-i)*c,y+7*c,c,c);ctx.fillStyle=colors.blue;ctx.fillRect(x+7*c,y+(14-i)*c,c,c);ctx.fillStyle=colors.red;ctx.fillRect(x+i*c,y+7*c,c,c)}ctx.fillStyle=colors.red;tri(x+6*c,y+6*c,x+7.5*c,y+7.5*c,x+6*c,y+9*c);ctx.fillStyle=colors.green;tri(x+6*c,y+6*c,x+9*c,y+6*c,x+7.5*c,y+7.5*c);ctx.fillStyle=colors.yellow;tri(x+9*c,y+6*c,x+9*c,y+9*c,x+7.5*c,y+7.5*c);ctx.fillStyle=colors.blue;tri(x+6*c,y+9*c,x+7.5*c,y+7.5*c,x+9*c,y+9*c);ctx.fillStyle='rgba(5,10,30,.18)';ctx.font=`900 ${c*.62}px Arial`;ctx.textAlign='center';ctx.fillText('LPL',x+7.5*c,y+7.7*c);[[2,8],[6,2],[12,6],[8,12]].forEach(p=>star(x+(p[0]+.5)*c,y+(p[1]+.5)*c,c*.34));ctx.restore()}function drawTokens(){players.forEach(p=>p.tokens.forEach((v,i)=>{let pos=tokenXY(p,i);drawPawn(pos.x,pos.y,colors[p.color],i+1,p.human&&canMove)}))}function drawPawn(x,y,color,num,glow){ctx.save();if(glow){ctx.shadowColor='#fff';ctx.shadowBlur=17}ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,14,13,5,0,0,Math.PI*2);ctx.fill();let grd=ctx.createLinearGradient(-13,-19,13,18);grd.addColorStop(0,'#fff');grd.addColorStop(.42,color);grd.addColorStop(1,'#07142f');ctx.fillStyle=grd;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,16);ctx.bezierCurveTo(-13,5,-12,-8,0,-19);ctx.bezierCurveTo(12,-8,13,5,0,16);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(0,0,0,.45)';ctx.font='900 10px Arial';ctx.textAlign='center';ctx.fillText(num,0,4);ctx.restore()}function roundRect(x,y,w,h,r,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);fill?ctx.fill():ctx.stroke()}function circle(x,y,r,f){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);f?ctx.fill():ctx.stroke()}function tri(a,b,c,d,e,f){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.closePath();ctx.fill()}function star(cx,cy,r){ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle='#7c7c7c';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:r*.43;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}resize();setInterval(()=>{if(screen==='game')draw()},1000/30);
</script>
